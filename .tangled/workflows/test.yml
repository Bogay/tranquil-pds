when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

environment:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  TMPDIR: "/dev/shm"

dependencies:
  - rustup
  - gcc
  - pkg-config
  - openssl
  - protobuf
  - just
  - cargo-nextest

steps:
  - name: test
    command: just test
