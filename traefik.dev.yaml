tls:
  certificates:
    - certFile: /certs/pds.test.pem
      keyFile: /certs/pds.test-key.pem

http:
  routers:
    backend:
      rule: "Host(`pds.test`) && (PathPrefix(`/xrpc`) || PathPrefix(`/oauth`) || PathPrefix(`/.well-known`) || PathPrefix(`/u`) || Path(`/health`) || Path(`/`))"
      entryPoints:
        - websecure
      service: backend
      tls: {}
    frontend:
      rule: "Host(`pds.test`)"
      entryPoints:
        - websecure
      service: frontend
      priority: 1
      tls: {}
    s3:
      rule: "Host(`s3.pds.test`)"
      entryPoints:
        - websecure
      service: s3
      tls: {}
    garage-webadmin:
      rule: "Host(`garage.pds.test`)"
      entryPoints:
        - websecure
      service: garage-webadmin
      tls: {}
    handles:
      rule: 'HostRegexp(`^.+\.pds\.test$`) && !Host(`s3.pds.test`) && !Host(`garage.pds.test`)'
      entryPoints:
        - websecure
      service: backend
      tls: {}

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://app-dev:3000"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend-dev:5173"
    s3:
      loadBalancer:
        servers:
          - url: "http://garage:3900"
    garage-webadmin:
      loadBalancer:
        servers:
          - url: "http://webadmin:8080"
