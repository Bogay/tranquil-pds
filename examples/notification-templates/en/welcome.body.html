<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{hostname}}</title>
</head>
<body style="margin:0;padding:0;background:#f9fafa;font-family:Georgia,'Times New Roman',serif;color:#1a1d1d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f9fafa;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border:1px solid #dce0df;padding:32px;">
          <tr>
            <td style="font-size:20px;font-weight:700;padding-bottom:16px;">{{hostname}}</td>
          </tr>
          <tr>
            <td style="font-size:16px;line-height:1.5;">
              <p>{{#if handle}}Welcome to {{hostname}}, @{{handle}}!{{else}}Welcome to {{hostname}}!{{/if}}</p>
              <br/>
              {{#if handle}}
                <p>Your handle is: <strong>@{{handle}}</strong></p>
              {{else}}
                <p>Set your handle to personalize your account.</p>
              {{/if}}
              <br/>
              <p>Thank you for joining us.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
